name: Release

# Tag main with a version (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to:
#   1. build & GPG-sign the Flatpak,
#   2. generate a build-provenance attestation for the bundle,
#   3. publish the signed OSTree repo to GitHub Pages (dl.nikableh.moe),
#   4. build the standalone macOS .app (build-aux/macos/bundle.sh) and pack
#      it into a .dmg,
#   5. create a GitHub Release with the .flatpak and .dmg attached.
#
# Requires repo secrets FLATPAK_GPG_PRIVATE_KEY and FLATPAK_GPG_KEY_ID, Pages
# set to "GitHub Actions" as its source, and (for public reach) a public repo.
# See docs/RELEASING.md for the one-time setup.
#
# The .dmg is ad-hoc signed only (no Apple Developer ID/notarization), so
# Gatekeeper will flag it as from an unidentified developer on first launch -
# right-click > Open, or System Settings > Privacy & Security > Open Anyway,
# clears it. Notarizing would need a paid Developer ID and its own secrets;
# out of scope until someone asks for it.

on:
  push:
    tags:
      - 'v*'
  # Manual runs build & publish Pages but skip the GitHub Release (no tag).
  workflow_dispatch:

permissions:
  contents: write      # create the GitHub Release
  pages: write         # deploy to GitHub Pages
  id-token: write      # Pages deployment + Sigstore signing for attestations
  attestations: write  # write the build-provenance attestation

# Never let two publishes clobber each other's repo/summary.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_ID: moe.nikableh.Koshi
  MANIFEST: build-aux/moe.nikableh.Koshi.json

jobs:
  build:
    name: Build & sign Flatpak
    runs-on: ubuntu-latest
    container:
      # Matches runtime-version "50" in the manifest. If this tag 404s, bump to
      # the newest available gnome-* tag at ghcr.io/flathub-infra/flatpak-github-actions.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    # One fixed GNUPGHOME shared by every step AND the flatpak-builder action's
    # export subprocess (a mktemp/GITHUB_ENV path isn't reliably seen by the
    # action inside the container), so the imported signing key is always found.
    # Literal path: the `runner` context is not available in job-level env.
    env:
      GNUPGHOME: /tmp/koshi-gnupg
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build Flatpak bundle (signed)
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: koshi.flatpak
          # The action's `branch` defaults to "master"; publish on "stable" to
          # match the manifest's default-branch and the .flatpakrepo/.flatpakref.
          branch: stable
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          cache-key: flatpak-builder-${{ github.sha }}

      # Signed, tamper-evident record of where and how the bundle was built.
      # Verify a download with: gh attestation verify koshi.flatpak -R nikableh/koshi
      - name: Attest build provenance of the bundle
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: koshi.flatpak

      - name: Regenerate signed repo summary & static deltas
        run: |
          flatpak build-update-repo \
            --generate-static-deltas \
            --prune \
            --gpg-sign="${{ secrets.FLATPAK_GPG_KEY_ID }}" \
            --gpg-homedir="$GNUPGHOME" \
            repo

      - name: Assemble Pages site and release assets
        run: |
          set -eu
          KEYID="${{ secrets.FLATPAK_GPG_KEY_ID }}"

          mkdir -p site dist
          cp -a repo site/repo

          # Public key: attached to the release and used to fill the templates.
          gpg --batch --export "$KEYID" > site/koshi.gpg
          KEY_B64="$(base64 -w0 site/koshi.gpg)"

          # base64 alphabet has no '|', so it's safe as a sed replacement.
          sed "s|@GPGKEY@|$KEY_B64|" build-aux/koshi.flatpakrepo.in > site/koshi.flatpakrepo
          sed "s|@GPGKEY@|$KEY_B64|" build-aux/koshi.flatpakref.in  > site/koshi.flatpakref

          cp build-aux/pages-index.html site/index.html
          cp "data/icons/scalable/apps/${APP_ID}.svg" site/koshi.svg
          echo "dl.nikableh.moe" > site/CNAME

          # Release assets (bundle + verification material).
          cp koshi.flatpak       dist/koshi.flatpak
          cp site/koshi.gpg      dist/koshi.gpg
          cp site/koshi.flatpakrepo dist/koshi.flatpakrepo
          cp site/koshi.flatpakref  dist/koshi.flatpakref

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  build-macos:
    name: Build macOS app (.dmg)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        # rust: cargo/rustc (edition 2024). gtk4/libadwaita/libsoup@3: the
        # runtime stack bundle.sh links against and then bundles into the
        # .app. dylibbundler: copies and relinks every dependent dylib.
        # librsvg: gdk-pixbuf's SVG loader, and rsvg-convert for the app icon.
        # adwaita-icon-theme: neither gtk4 nor libadwaita depends on it, but
        # bundle.sh copies it in for the symbolic icons Koshi's UI uses -
        # without it explicitly listed here, a runner with no other GTK app
        # ever built on it (unlike a dev's already-populated Homebrew prefix)
        # won't have it.
        run: brew install rust gtk4 libadwaita libsoup@3 dylibbundler librsvg adwaita-icon-theme

      - name: Build Koshi.app
        run: bash build-aux/macos/bundle.sh

      - name: Package as .dmg
        run: |
          set -eu
          STAGE="$(mktemp -d)/Koshi"
          mkdir -p "$STAGE"
          cp -R target/macos/Koshi.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          hdiutil create -volname Koshi -srcfolder "$STAGE" -ov -format UDZO dist/koshi.dmg

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: dist/
          if-no-files-found: error

  deploy-pages:
    name: Publish to dl.nikableh.moe
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create GitHub Release
    needs: [build, build-macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-macos
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/koshi.flatpak
            dist/koshi.gpg
            dist/koshi.flatpakrepo
            dist/koshi.flatpakref
            dist/koshi.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
