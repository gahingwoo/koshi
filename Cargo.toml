[package]
name = "koshi"
version = "0.3.0"
edition = "2024"
default-run = "koshi"
description = "Read and reply to kernel mailing lists"
authors = ["Nika Krasnova <nika@nikableh.moe>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/nikableh/koshi"
repository = "https://github.com/nikableh/koshi"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9", "gtk_v4_22"] }
# Already in the tree via gtk; listed directly only to enable its bridge that
# routes `log` records into GLib logging (GlibLogger).
glib = { version = "0.22", features = ["log"] }
log = "0.4"
mailparse = "0.16"
soup = { package = "soup3", version = "0.9" }
flate2 = "1"
quick-xml = "0.38"
serde_json = "1"
# Line wrapping for the composer's "Rewrap Selection". Only the greedy
# (FirstFit) algorithm and display-width counting are used, so smawk and
# unicode-linebreak are left off.
textwrap = { version = "0.16", default-features = false, features = [
    "unicode-width",
] }

[build-dependencies]
glib-build-tools = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "std", "alloc", "block2", "UNNotificationTrigger"] }
